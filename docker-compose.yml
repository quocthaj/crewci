services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      CREWCI_DB_PATH: /data/crewci.db
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
